
services:
  database:
    image: postgres:17
    container_name: rover_database
    restart: unless-stopped

    environment:
      POSTGRES_DB: rover_db
      POSTGRES_USER: rover_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rover_user -d rover_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
